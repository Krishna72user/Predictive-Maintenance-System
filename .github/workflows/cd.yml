name: CD

on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed
jobs:
    build-and-deploy:
        if : ${{ github.event.workflow_run.conclusion == 'success'}}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            
            - name: Configure DVC
              run: |
                pip install dvc dvc-s3 dvc-http
                dvc remote modify origin --local access_key_id ${{ secrets.ACCESS_KEY_ID}}
                dvc remote modify origin --local secret_access_key ${{ secrets.SECRET_ACCESS_KEY}}

            - name: Pull model
              run: dvc pull models/model.joblib
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build Docker image
              run: docker build -t ${{ secrets.DOCKER_USERNAME }}/predictive-maintenance:latest .

            - name: Push Docker image
              run: docker push ${{ secrets.DOCKER_USERNAME }}/predictive-maintenance:latest
            - name: Added deploy hook in CD
              run: curl -X POST "${{secrets.DEPLOY_HOOK}}"